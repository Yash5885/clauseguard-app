name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clauseguard_test
          POSTGRES_USER: clauseguard
          POSTGRES_PASSWORD: localtest
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U clauseguard" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://clauseguard:localtest@localhost:5432/clauseguard_test
      - run: npm run lint && npm run build
