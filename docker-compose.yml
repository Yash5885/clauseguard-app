services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: clauseguard
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: {context: ./server, target: development}
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://clauseguard:localdev@db:5432/clauseguard
    ports: ["4000:4000"]
    volumes: ["./server/src:/app/src"]
    depends_on:
      db: {condition: service_healthy}
  client:
    build: {context: ./client, target: development}
    env_file: ./client/.env.local
    ports: ["3000:3000"]
    volumes: ["./client/src:/app/src"]
    depends_on: [server]
volumes:
  pgdata:
